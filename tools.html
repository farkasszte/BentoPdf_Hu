    </title>

    />

      name="keywords"
      content="pdf eszközök, pdf konvertáló, pdf szerkesztő, pdf biztonság, ingyenes pdf eszközök, online pdf eszközök"
    />

    <!-- Navigation -->
    {{> navbar }}

    <!-- Hero -->
    <section class="container mx-auto px-4 py-12">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-3xl md:text-5xl font-bold text-white mb-6">
          Minden PDF-eszköz katalógusa
        </h1>
        <p class="text-lg text-gray-300 mb-8">
          Böngéssz a 100+ ingyenes PDF-eszközt felölelő teljes gyűjteményünkben.
          Keress név szerint, vagy szűrj kategória alapján.
        </p>
      </div>
    </section>

    <!-- Search & Filter -->
    <section class="container mx-auto px-4 mb-8">
      <div class="max-w-6xl mx-auto">
        <!-- Search Bar -->
        <div class="mb-6">
          <div class="relative">
            <i
              class="ph ph-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-xl text-gray-400"
            ></i>
            <input
              type="text"
              id="search-input"
              placeholder="Eszközök keresése… (pl. „tömörítés", „Word-be konvertálás", „egyesítés")"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg pl-12 pr-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            />
          </div>
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap gap-3 mb-6">
          <button class="category-filter active" data-category="all">
            Minden eszköz
            <span class="ml-1 text-xs opacity-75" id="count-all">103</span>
          </button>
          <button class="category-filter" data-category="converter">
            Konvertálók
            <span class="ml-1 text-xs opacity-75" id="count-converter">47</span>
          </button>
          <button class="category-filter" data-category="editor">
            Szerkesztők
            <span class="ml-1 text-xs opacity-75" id="count-editor">23</span>
          </button>
          <button class="category-filter" data-category="security">
            Biztonság
            <span class="ml-1 text-xs opacity-75" id="count-security">10</span>
          </button>
          <button class="category-filter" data-category="merge-split">
            Egyesítés és szétbontás
            <span class="ml-1 text-xs opacity-75" id="count-merge-split"
              >12</span
            >
          </button>
          <button class="category-filter" data-category="other">
            Egyéb eszközök
            <span class="ml-1 text-xs opacity-75" id="count-other">11</span>
          </button>
        </div>

        <!-- Results Count -->
        <div class="text-gray-400 text-sm mb-4">
          Megjelenítve: <span id="results-count">103</span> eszköz
        </div>
      </div>
    </section>

    <!-- Tools Grid -->
    <section class="container mx-auto px-4 pb-12">
      <div class="max-w-6xl mx-auto">
        <div
          id="tools-grid"
          class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
        ></div>

        <div id="no-results" class="hidden text-center py-12">
          <i
            class="ph ph-magnifying-glass-minus text-6xl text-gray-600 mx-auto mb-4"
          ></i>
          <h3 class="text-xl font-semibold text-white mb-2">
            Nem találtunk eszközöket
          </h3>
          <p class="text-gray-400">Próbáld módosítani a keresést vagy a szűrőt</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    {{> footer }}

      let currentCategory = 'all';
      let searchQuery = '';

      function renderTools() {
        const grid = document.getElementById('tools-grid');
        const noResults = document.getElementById('no-results');

        const filtered = tools.filter((tool) => {
          const matchesCategory =
            currentCategory === 'all' || tool.category === currentCategory;
          const matchesSearch =
            tool.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            tool.name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        if (filtered.length === 0) {
          grid.classList.add('hidden');
          noResults.classList.remove('hidden');
          document.getElementById('results-count').textContent = '0';
          return;
        }

        grid.classList.remove('hidden');
        noResults.classList.add('hidden');

        grid.innerHTML = filtered
          .map(
            (tool) => `
                <a href="/${tool.name}.html" class="tool-card">
                    <i class="ph ph-${tool.icon} text-4xl text-indigo-400 mb-2"></i>
                    <h3 class="font-semibold text-white text-sm">${tool.title}</h3>
                </a>
            `
          )
          .join('');

        document.getElementById('results-count').textContent = filtered.length;
      }

      document.querySelectorAll('.category-filter').forEach((btn) => {
        btn.addEventListener('click', () => {
          document
            .querySelectorAll('.category-filter')
            .forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          renderTools();
        });
      });

      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderTools();
      });

      renderTools();
    </script>
