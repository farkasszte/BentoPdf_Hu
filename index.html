<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>
      PDF eszközök – ingyenes online PDF szerkesztő és konvertáló | PDF stúdió
    </title>
    <meta
      name="title"
      content="PDF eszközök – ingyenes online PDF szerkesztő és konvertáló"
    />
    <meta
      name="description"
      content="Ingyenes online PDF eszközök – PDF egyesítése, szétválasztása, tömörítése és konvertálása. 100%-ban böngészőben fut, regisztráció nélkül, korlátlan fájlokkal."
    />

    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="PDF eszközök" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon-512x512.png"
    />
    <!-- Google Fonts: Roboto Condensed & Roboto matching Kincsesláda -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <link href="src/css/styles.css" rel="stylesheet" />
  </head>

  <body class="antialiased">
    <div id="app" class="min-h-screen w-full px-2 sm:px-4 py-2">
      <div id="grid-view">
        <div
          id="tool-grid"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4"
        ></div>
      </div>

      <div
        id="tool-interface"
        class="hidden w-full max-w-5xl mx-auto bg-white dark:bg-slate-900 rounded-3xl shadow-xl p-6 md:p-8 border border-medium dark:border-slate-800 text-dark dark:text-dark-text"
      >
        <button
          id="back-to-grid"
          class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-accent hover:text-accent-hover mb-6 px-3.5 py-2 rounded-xl bg-accent/10 border border-accent/20 transition-all cursor-pointer"
        >
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span> Vissza az eszközökhöz </span>
        </button>
        <div id="tool-content"></div>
      </div>

      <div
        id="loader-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50"
      >
        <div
          class="bg-gray-800 p-8 rounded-lg flex flex-col items-center gap-4 border border-gray-700 shadow-xl"
        >
          <div class="solid-spinner"></div>
          <p
            id="loader-text"
            class="text-white text-lg font-medium"
            data-i18n="loader.processing"
          >
            Processing...
          </p>
        </div>
      </div>

      <div
        id="alert-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4"
      >
        <div
          class="bg-gray-800 max-w-sm w-full p-6 rounded-lg border border-gray-700 shadow-xl text-center"
        >
          <h3
            id="alert-title"
            class="text-xl font-bold text-white mb-2"
            data-i18n="alert.title"
          >
            Figyelmeztetés
          </h3>
          <p id="alert-message" class="text-gray-300 mb-6 whitespace-pre-line">
            Ez egy figyelmeztető üzenet.
          </p>
          <button
            id="alert-ok"
            class="btn bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-indigo-700"
            data-i18n="alert.ok"
          >
            OK
          </button>
        </div>
      </div>

      <div
        id="preview-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-40 p-4"
      >
        <div
          class="bg-white text-black rounded-lg shadow-xl w-full max-w-4xl h-[90vh] flex flex-col"
        >
          <div class="p-4 border-b flex justify-between items-center">
            <h3 class="text-xl font-bold" data-i18n="preview.title">
              Dokumentum előnézet
            </h3>
            <div class="flex gap-4">
              <button
                id="preview-download-btn"
                class="btn bg-indigo-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-indigo-700"
                data-i18n="preview.downloadAsPdf"
              >
                Letöltés PDF-ként
              </button>
              <button
                id="preview-close-btn"
                class="btn bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg hover:bg-gray-700"
                data-i18n="preview.close"
              >
                Bezárás
              </button>
            </div>
          </div>
          <div id="preview-content" class="p-8 overflow-y-auto flex-grow"></div>
        </div>
      </div>

      <!-- Shortcuts Modal -->
      {{> settings-modal }}

      <!-- Warning Modal -->
      {{> warning-modal }}

      <div id="signature-ghost" class="hidden"></div>

      <!-- Scroll to Top Button -->
      <button
        id="scroll-to-top-btn"
        class="fixed bottom-12 right-8 bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-full shadow-lg transition-all duration-300 opacity-0 translate-y-10 invisible z-40"
        aria-label="Ugrás az oldal tetejére"
      >
        <i data-lucide="arrow-up" class="w-6 h-6"></i>
      </button>
    </div>

    <!-- Simple mode footer -->
    <footer
      class="mt-12 border-t border-medium dark:border-slate-800 py-6"
      data-simple-footer="true"
    >
      <div class="container mx-auto px-4">
        <div
          class="flex items-center justify-between flex-wrap gap-4 text-xs text-muted dark:text-slate-400"
        >
          <div class="flex items-center gap-2">
            <span class="font-bold text-dark dark:text-dark-text"
              >BentoPDF stúdió</span
            >
            <span>&bull;</span>
            <span>100% böngészőoldali PDF feldolgozás</span>
          </div>
          <div id="simple-mode-lang-switcher" class="flex-shrink-0"></div>
        </div>
      </div>
    </footer>

    <script type="module" src="src/js/utils/lucide-init.ts"></script>
    <script type="module" src="src/js/utils/simple-mode-footer.ts"></script>
    <script type="module" src="src/js/main.ts"></script>
    <script type="module" src="src/js/sw-register.ts"></script>
  </body>
</html>
